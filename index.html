<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlantPulse — Smart Plant Moisture Monitor (EVS)</title>
  <meta name="description" content="Monitor your plant's soil moisture in real-time with smart sensor alerts. Keep your plants healthy effortlessly." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1912" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="bg-animated"></div>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><img src="assets/plantpulse-logo.svg" alt="PlantPulse" /></div>
      <div>
        <div class="logo-text">PlantPulse</div>
        <div class="logo-sub">Smart Moisture Monitoring & Sensor E-Shop</div>
      </div>
    </div>

    <h1 class="auth-title">Welcome back 👋</h1>
    <p class="auth-subtitle">Login to monitor your plants or manage hardware sensor orders.</p>

    <div class="alert-msg" id="login-error"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px">
          <label class="form-label" for="password" style="margin-bottom:0">Password</label>
          <button type="button" id="toggle-password" aria-label="Toggle password visibility" style="background:none; border:none; color:var(--text-2); font-size:12px; cursor:pointer; display:flex; align-items:center; gap:4px">
            <span id="pwd-icon">👁️</span> <span id="pwd-text">Show</span>
          </button>
        </div>
        <input
          type="password"
          id="password"
          class="form-control"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" id="login-btn" class="btn btn-primary btn-full" style="margin-top:8px">
        Login to Dashboard
      </button>
    </form>



    <div class="auth-link" style="margin-top:16px">
      Don't have an account? <a href="register.html">Create Buyer Account</a>
    </div>

    <!-- Cloud Backend Switcher -->
    <div style="text-align:center;margin-top:18px;font-size:12px;color:var(--text-3);border-top:1px solid rgba(255,255,255,0.06);padding-top:14px">
      <span>Cloud API: <strong id="api-status-label" style="color:var(--primary)">Detecting...</strong></span>
      &nbsp;•&nbsp;
      <a href="javascript:void(0)" id="change-api-btn" style="color:var(--text-2);text-decoration:underline">Configure URL</a>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  // Display active Cloud API endpoint
  const statusLabel = document.getElementById('api-status-label');
  if (statusLabel) {
    try {
      const urlObj = new URL(BASE_URL, window.location.origin);
      statusLabel.textContent = urlObj.host || 'Local/Cloud';
    } catch(e) {
      statusLabel.textContent = BASE_URL;
    }
  }

  document.getElementById('change-api-btn')?.addEventListener('click', () => {
    const current = localStorage.getItem('pm_cloud_api_url') || BASE_URL;
    const input = prompt(
      "Enter Cloud Backend API URL (e.g. https://plantpulse.free.nf/api or https://plantpulse.onrender.com/api):\nLeave empty to reset to default:",
      current
    );
    if (input !== null) {
      window.setCloudApiUrl(input.trim());
    }
  });

  // Password visibility toggle
  const togglePwdBtn = document.getElementById('toggle-password');
  const pwdInput = document.getElementById('password');
  const pwdIcon = document.getElementById('pwd-icon');
  const pwdText = document.getElementById('pwd-text');

  if (togglePwdBtn && pwdInput) {
    togglePwdBtn.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      if (pwdIcon) pwdIcon.textContent = isPassword ? '🙈' : '👁️';
      if (pwdText) pwdText.textContent = isPassword ? 'Hide' : 'Show';
    });
  }

  // Demo feedback helper
  function showDemoFeedback(msg) {
    const pill = document.getElementById('demo-feedback-pill');
    if (pill) {
      pill.textContent = msg;
      pill.style.display = 'block';
      setTimeout(() => {
        pill.style.display = 'none';
      }, 3500);
    }
  }

  // If already logged in, redirect based on role
  (async () => {
    try {
      const res  = await fetch(`${BASE_URL}/auth/check.php`);
      const data = await res.json();
      if (data.authenticated) {
        if (data.user && data.user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      }
    } catch (e) {}
  })();

  function completeLogin(userData, token, targetUrl) {
    localStorage.setItem('pm_user', JSON.stringify(userData));
    if (token) {
      localStorage.setItem('pm_token', token);
    }
    window.location.href = targetUrl;
  }

  async function performLogin(email, password) {
    const cleanEmail = email.trim().toLowerCase();
    const cleanPass  = password.trim();

    try {
      const res = await fetch(`${BASE_URL}/auth/login.php`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: cleanEmail, password: cleanPass })
      });
      const data = await res.json();
      if (data && data.success && data.user) {
        const dest = (data.user.role === 'admin') ? 'admin.html' : 'dashboard.html';
        completeLogin(data.user, data.token, dest);
        return { success: true };
      } else {
        return { success: false, message: data?.message || 'Invalid email or password.' };
      }
    } catch (err) {
      return { success: false, message: 'Connection error. Check cloud backend or server status.' };
    }
  }

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl  = document.getElementById('login-error');
    const btn    = document.getElementById('login-btn');
    if (btn.disabled) return;

    const emailRaw = document.getElementById('email').value || '';
    const passRaw  = document.getElementById('password').value || '';

    const cleanEmail = emailRaw.trim().toLowerCase();
    const cleanPass  = passRaw.trim();

    if (!cleanEmail || !cleanPass) {
      errEl.textContent = 'Please enter your email and password.';
      errEl.className = 'alert-msg show error';
      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ Logging in…';
    errEl.className = 'alert-msg';

    const result = await performLogin(cleanEmail, cleanPass);
    if (!result.success) {
      errEl.textContent = result.message;
      errEl.className = 'alert-msg show error';
      btn.disabled = false;
      btn.textContent = 'Login to Dashboard';
    }
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=5')
        .then(reg => console.log('Service Worker registered:', reg.scope))
        .catch(err => console.log('Service Worker registration failed:', err));
    });
  }
</script>
</body>
</html>
