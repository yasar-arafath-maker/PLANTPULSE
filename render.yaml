services:
  - type: web
    name: plantpulse-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/ping.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
